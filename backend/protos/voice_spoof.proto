syntax = "proto3";
package cyphex;

service VoiceSpoofDetector {
  rpc StreamDetect (stream AudioChunk) returns (stream DetectionVerdict);
  rpc AnalyzeFile (AudioFile) returns (AnalysisReport);
  rpc EnrollSpeaker (EnrollmentRequest) returns (EnrollmentResponse);
}

message AudioChunk {
  string session_id = 1;
  int64 sequence_number = 2;
  int32 sample_rate = 3;
  bytes pcm_data = 4;
}

message DetectionVerdict {
  string session_id = 1;
  int64 sequence_number = 2;
  bool is_deepfake = 3;
  float spoof_probability = 4;
  float speaker_match_similarity = 5;
  repeated string anomaly_flags = 6;
  int32 latency_ms = 7;
  string risk_level = 8;
  string recommendation = 9;
}

message AudioFile {
  string filename = 1;
  bytes content = 2;
}

message AnalysisReport {
  string file_id = 1;
  float duration_sec = 2;
  float overall_risk_score = 3;
  string risk_level = 4;
  repeated string flags = 5;
}

message EnrollmentRequest {
  string speaker_name = 1;
  bytes audio_content = 2;
  string metadata_json = 3;
}

message EnrollmentResponse {
  string speaker_id = 1;
  bool success = 2;
  string error_message = 3;
}
